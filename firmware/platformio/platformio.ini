; PlatformIO 工程配置
; 默认目标是 ESP32-WROOM-32 (esp32dev). 如果你的板子不一样, 改 board 即可.
;
; 烧录:
;     cd firmware/platformio
;     pio run -t upload
; 串口监视:
;     pio device monitor -b 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 如果烧录端口不固定, 可以让 PlatformIO 自动发现, 也可以显式设置:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

build_flags =
    -D MONITOR_FW_VERSION=\"1.0.0\"
